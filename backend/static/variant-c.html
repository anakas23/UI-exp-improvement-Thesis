<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Alat Centar - Varijanta C</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  /* ============================================
     VARIJANTA C - nav je VERTIKALNI stupac lijevo koji
     se proteže cijelom visinom stranice (kao app sidebar)
     i UNUTAR SEBE sadrži i filtere (sidebar zona je
     ugniježđena unutar nav stupca, a ne zaseban blok kao
     u A/B). Hero i katalog su u glavnom sadržajnom
     stupcu desno, jedno ispod drugog. Katalog je uži
     (2 stupca) jer dijeli prostor s lijevim stupcem.
     ============================================ */
  .page-grid {
    grid-template-columns: 240px 1fr;
    grid-template-areas:
      "nav hero"
      "nav products"
      "footer footer";
  }
  .zone-nav {
    grid-area: nav;
    border-right: 1px solid var(--color-border);
    border-bottom: none;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px 20px;
  }
  .zone-nav .nav-menu { flex-direction: column; gap: 4px; }
  .zone-hero { grid-area: hero; padding: 28px 32px; }
  .zone-hero h1 { font-size: 1.5rem; }
  .zone-products { grid-area: products; }
  .zone-footer { grid-area: footer; }

  /* sidebar (filteri) ugniježđen unutar nav stupca */
  .zone-sidebar { margin-top: auto; border: none; padding: 0; background: transparent; }

  .products-grid { grid-template-columns: repeat(2, 1fr); max-width: 700px; }
</style>
</head>
<body data-page-variant="variant_c">

<div class="page-grid">

  <nav class="zone-nav" data-zone="nav">
    <div class="nav-logo">Alat Centar</div>
    <ul class="nav-menu">
      <li><a href="#" data-action="show-categories">Početna</a></li>
      <li><a href="#" data-action="show-all-products">Proizvodi</a></li>
      <li><a href="#" onclick="return false;">Kontakt</a></li>
    </ul>

    <aside class="zone-sidebar" data-zone="sidebar">
      <h3>Cijena</h3>
      <div class="filter-group">
        <label><input type="checkbox" name="price-filter" value="under20"> Do 20 €</label>
        <label><input type="checkbox" name="price-filter" value="mid"> 20 € - 80 €</label>
        <label><input type="checkbox" name="price-filter" value="over80"> Preko 80 €</label>
      </div>
    </aside>
  </nav>

  <section class="zone-hero" data-zone="hero">
    <h1>Kvalitetni alati za profesionalce i hobiste</h1>
    <p>Zadatak: pronađite kutnu brusilicu koja košta <strong>89 €</strong> i dovršite kupnju.</p>
  </section>

  <main class="zone-products" data-zone="products">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="products-grid" id="categoryGrid"></div>
    <div class="products-grid" id="productGrid" hidden></div>
  </main>

  <footer class="zone-footer" data-zone="footer">
    <div>© 2026 Alat Centar. Sva prava pridržana.</div>
    <div>
      <a href="#" onclick="return false;">O nama</a> &nbsp;|&nbsp;
      <a href="#" onclick="return false;">Kontakt</a> &nbsp;|&nbsp;
      <a href="#" onclick="return false;">Uvjeti korištenja</a>
    </div>
  </footer>

</div>

<script src="shared/click-logger.js"></script>
<script src="shared/shop-flow.js"></script>
</body>
</html>
