<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alat Centar - Varijanta C</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  /* ============================================
     VARIJANTA C - nav je vertikalni stupac lijevo koji
     se proteže preko hero+products redova, quick-nav je
     ugniježđen unutar nav stupca. Katalog je uži (2 stupca
     po sekciji).
     Redoslijed kategorija (vidi catalog.js): Električni
     alati (cilj) U SREDINI stranice (2. od 4 kategorije).
     ============================================ */
  .page-grid {
    grid-template-columns: 240px 1fr;
    grid-template-areas:
      "nav hero"
      "nav products"
      "footer footer";
  }
  .zone-nav {
    grid-area: nav;
    border-right: 1px solid var(--color-border);
    border-bottom: none;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px 20px;
  }
  .zone-nav .nav-menu { flex-direction: column; gap: 4px; }
  .zone-hero { grid-area: hero; padding: 28px 32px; }
  .zone-hero h1 { font-size: 1.5rem; }
  .zone-products { grid-area: products; }
  .zone-footer { grid-area: footer; }

  /* sidebar (quick-nav) ugniježđen unutar nav stupca, odmah ispod menija */
  .zone-sidebar { border: none; padding: 0; background: transparent; }

  .product-grid { grid-template-columns: repeat(2, 1fr); max-width: 700px; }

  @media (max-width: 700px) {
    .page-grid {
      grid-template-columns: 1fr;
      grid-template-areas:
        "nav"
        "hero"
        "products"
        "footer";
    }
    .zone-nav {
      border-right: none;
      border-bottom: 1px solid var(--color-border);
    }
    .product-grid { grid-template-columns: repeat(2, 1fr); max-width: 100%; }
  }
  @media (max-width: 420px) {
    .product-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-page-variant="variant_c">

<div class="page-grid">

  <nav class="zone-nav" data-zone="nav">
    <div class="nav-logo">Alat Centar</div>
    <ul class="nav-menu">
      <li><a href="#" data-action="scroll-top">Početna</a></li>
      <li><a href="#" onclick="return false;">Kontakt</a></li>
    </ul>

    <aside class="zone-sidebar" data-zone="sidebar">
      <h3>Kategorije</h3>
      <nav class="quick-nav" id="categoryQuickNav"></nav>
    </aside>
  </nav>

  <section class="zone-hero" data-zone="hero">
    <h1>Kvalitetni alati za profesionalce i hobiste</h1>
    <p>Zadatak: pronađite kutnu brusilicu koja košta <strong>89 €</strong> i dovršite kupnju.</p>
  </section>

  <main class="zone-products" data-zone="products">
    <div id="productCatalog"></div>
  </main>

  <footer class="zone-footer" data-zone="footer">
    <div>© 2026 Alat Centar. Sva prava pridržana.</div>
    <div>
      <a href="#" onclick="return false;">O nama</a> &nbsp;|&nbsp;
      <a href="#" onclick="return false;">Kontakt</a> &nbsp;|&nbsp;
      <a href="#" onclick="return false;">Uvjeti korištenja</a>
    </div>
  </footer>

</div>

<script src="shared/click-logger.js"></script>
<script src="shared/catalog.js"></script>
</body>
</html>
