<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alat Centar - Varijanta B</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  /* ============================================
     VARIJANTA B - DVOSTUPČANI raspored: lijevo trajni
     vertikalni sidebar (quick-nav), desno katalog.
     Katalog je gušći - 4 stupca po sekciji.
     Redoslijed kategorija (vidi catalog.js): Električni
     alati (cilj) NA DNU stranice - mora se proći kroz
     3 kategorije prije toga.
     ============================================ */
  .page-grid {
    grid-template-columns: 220px 1fr;
    grid-template-areas:
      "nav      nav"
      "hero     hero"
      "sidebar  products"
      "footer   footer";
  }
  .zone-nav { grid-area: nav; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .zone-hero { grid-area: hero; padding: 20px 32px; }
  .zone-hero h1 { font-size: 1.3rem; }
  .zone-sidebar { grid-area: sidebar; margin: 20px; border-radius: 8px; align-self: start; }
  .zone-products { grid-area: products; }
  .zone-footer { grid-area: footer; }

  .product-grid { grid-template-columns: repeat(4, 1fr); }

  @media (max-width: 700px) {
    .page-grid {
      grid-template-columns: 1fr;
      grid-template-areas:
        "nav"
        "hero"
        "sidebar"
        "products"
        "footer";
    }
    .zone-sidebar { margin: 16px; }
    .product-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .product-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-page-variant="variant_b">

<div class="page-grid">

  <nav class="zone-nav" data-zone="nav">
    <div class="nav-logo">Alat Centar</div>
    <ul class="nav-menu">
      <li><a href="#" data-action="scroll-top">Početna</a></li>
      <li><a href="#" onclick="return false;">Kontakt</a></li>
    </ul>
  </nav>

  <section class="zone-hero" data-zone="hero">
    <h1>Kvalitetni alati za profesionalce i hobiste</h1>
    <p>Zadatak: pronađite kutnu brusilicu koja košta <strong>89 €</strong> i dovršite kupnju.</p>
  </section>

  <aside class="zone-sidebar" data-zone="sidebar">
    <h3>Kategorije</h3>
    <nav class="quick-nav" id="categoryQuickNav"></nav>
  </aside>

  <main class="zone-products" data-zone="products">
    <div id="productCatalog"></div>
  </main>

  <footer class="zone-footer" data-zone="footer">
    <div>© 2026 Alat Centar. Sva prava pridržana.</div>
    <div>
      <a href="#" onclick="return false;">O nama</a> &nbsp;|&nbsp;
      <a href="#" onclick="return false;">Kontakt</a> &nbsp;|&nbsp;
      <a href="#" onclick="return false;">Uvjeti korištenja</a>
    </div>
  </footer>

</div>

<script src="shared/click-logger.js"></script>
<script src="shared/catalog.js"></script>
</body>
</html>
